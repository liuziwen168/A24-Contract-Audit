[project]
name = "a24-contract-audit-backend"
version = "0.1.0"
requires-python = ">=3.11,<4.0"
dependencies = [
  "fastapi>=0.115,<0.116",
  "pydantic>=2.7,<2.12",
  "uvicorn[standard]>=0.30,<0.31",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13,<1.14",
  "pymysql>=1.1,<1.2",
  "httpx>=0.28.1,<0.29",
  "python-multipart>=0.0.9,<0.1",
  "jinja2>=3.1,<4",
  "reportlab>=4,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<0.24",
  "ruff>=0.6,<0.7",
  "pypdf>=5,<6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "assets/fonts/*.ttf", "assets/fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
